name: Bilibili Monitor

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

# 限制同一时间只能运行一个监控实例，避免状态写入与提交冲突
concurrency:
  group: bilibili-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Monitor Script
        env:
          TZ: Asia/Shanghai  # 统一容器与 Python 运行时为北京时间 (UTC+8)
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_RECEIVE_ID: ${{ secrets.FEISHU_RECEIVE_ID }}
          FEISHU_RECEIVE_ID_TYPE: ${{ secrets.FEISHU_RECEIVE_ID_TYPE }}
          # 如需在 Github 环境变量中动态修改监控目标，可取消下方注释：
          # TARGET_UID: ${{ vars.TARGET_UID }}
          # TARGET_KEYWORD: ${{ vars.TARGET_KEYWORD }}
        run: python main.py

      - name: Commit State
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          if [ -f last_bvid.txt ]; then
            git add last_bvid.txt
            if ! git diff --quiet || ! git diff --staged --quiet; then
              git commit -m "chore: update monitor history state [skip ci]"
              git pull --rebase origin main || git pull --rebase origin master
              git push
            else
              echo "无状态变更，跳过提交"
            fi
          else
            echo "last_bvid.txt 尚未生成"
          fi